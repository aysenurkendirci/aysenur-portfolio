<section id="experience" class="sec experience" aria-labelledby="experience-title">
    <div class="container">
        <header class="sec-head rise">
            <h2 id="experience-title" class="sec-title" data-en="Experience" data-tr="Deneyim">Experience</h2>
            <span class="sec-rule" aria-hidden="true"></span>
        </header>
        <ol class="thread" data-thread>
            {{#each experiences}}
            <li class="thread-entry">
                <span class="clip" aria-hidden="true"></span>
                <article class="panel glow-card entry">
                    <div class="entry-meta">
                        <span class="entry-icon" aria-hidden="true"><i class="{{icon}}"></i></span>
                        <p class="entry-org">{{company}}</p>
                        <p class="entry-date" data-en="{{date.en}}" data-tr="{{date.tr}}">{{date.en}}</p>
                    </div>
                    <div class="entry-body">
                        <h3 class="entry-role" data-en="{{title.en}}" data-tr="{{title.tr}}">{{title.en}}</h3>
                        <p class="entry-summary" data-en="{{description.en}}" data-tr="{{description.tr}}">{{description.en}}</p>
                        <ul class="entry-points">
                            {{#each items}}
                            <li data-en="{{en}}" data-tr="{{tr}}">{{en}}</li>
                            {{/each}}
                        </ul>
                        <ul class="tag-list" aria-label="Technologies">
                            {{#each techList}}
                            <li class="tag">{{this}}</li>
                            {{/each}}
                        </ul>
                    </div>
                </article>
            </li>
            {{/each}}
        </ol>
    </div>
</section>
