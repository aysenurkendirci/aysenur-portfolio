<section id="contact" class="sec contact" aria-labelledby="contact-title">
    <div class="container">
        <header class="sec-head rise">
            <h2 id="contact-title" class="sec-title" data-en="Contact" data-tr="İletişim">Contact</h2>
            <span class="sec-rule" aria-hidden="true"></span>
        </header>
        <div class="contact-card rise">
            <div class="contact-inner">
                <div class="contact-copy">
                    <p class="contact-lead"
                       data-en="I'm looking for a long-term software engineering internship. I work full-stack, with a stronger focus on the backend. If there's a place like that on your team, I'd be glad to hear from you."
                       data-tr="Uzun dönemli bir yazılım mühendisliği stajı arıyorum. Full-stack çalışıyorum, ağırlığım backend'de. Ekibinizde buna uygun bir yer varsa sizden haber almaktan memnuniyet duyarım.">I'm looking for a long-term software engineering internship. I work full-stack, with a stronger focus on the backend. If there's a place like that on your team, I'd be glad to hear from you.</p>
                    <a class="contact-mail" href="mailto:{{PROFILE_EMAIL}}">
                        <i class="fa-solid fa-envelope" aria-hidden="true"></i>
                        <span>{{PROFILE_EMAIL}}</span>
                    </a>
                </div>
                <ul class="contact-actions">
                    <li>
                        <a class="pill-btn pill-btn-accent" href="{{PROFILE_CV}}" download="Ayse_Nur_Kendirci_CV.pdf">
                            <i class="fa-solid fa-file-arrow-down" aria-hidden="true"></i>
                            <span data-en="Download CV" data-tr="CV İndir">Download CV</span>
                        </a>
                    </li>
                    <li>
                        <a class="pill-btn" href="{{PROFILE_LINKEDIN}}" target="_blank" rel="noopener noreferrer">
                            <i class="fa-brands fa-linkedin-in" aria-hidden="true"></i>
                            <span>LinkedIn</span>
                        </a>
                    </li>
                    <li>
                        <a class="pill-btn" href="{{PROFILE_GITHUB}}" target="_blank" rel="noopener noreferrer">
                            <i class="fa-brands fa-github" aria-hidden="true"></i>
                            <span>GitHub</span>
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</section>
