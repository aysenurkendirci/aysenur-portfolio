<section id="home" class="hero hero-split" aria-labelledby="hero-title">
    <div class="hero-bg-word" aria-hidden="true">PORTFOLIO</div>
    <div class="container hero-split-layout">
        <div class="hero-left">
            <p class="intro-line" data-en="Hello, I'm" data-tr="Merhaba, ben">Hello, I'm</p>
            <h1 id="hero-title" class="hero-name">
                <span>Ayşe Nur</span>
                <span>Kendirci</span>
            </h1>
            <p class="hero-role"
               data-en="{{PROFILE_ROLE_EN}}"
               data-tr="{{PROFILE_ROLE_TR}}">
                {{PROFILE_ROLE_EN}}
            </p>
            <p class="hero-description"
               data-en="{{PROFILE_DESC_EN}}"
               data-tr="{{PROFILE_DESC_TR}}">
                {{PROFILE_DESC_EN}}
            </p>
            <div class="hero-buttons">
                <a href="#projects" class="btn" data-en="View Projects" data-tr="Projeleri Gör">
                    View Projects
                </a>
                <a href="{{PROFILE_CV}}"
                   class="btn btn-secondary"
                   download="Ayse_Nur_Kendirci_CV.pdf"
                   target="_blank"
                   rel="noopener noreferrer"
                   data-en="Download CV"
                   data-tr="CV İndir">
                    Download CV
                </a>
            </div>
            <div class="hero-social-icons" aria-label="Social media links">
                <a href="{{PROFILE_GITHUB}}" target="_blank" rel="noopener noreferrer" aria-label="GitHub profile">
                    <i class="devicon-github-original" aria-hidden="true"></i>
                </a>
                <a href="{{PROFILE_LINKEDIN}}" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn profile">
                    <i class="devicon-linkedin-plain" aria-hidden="true"></i>
                </a>
                <a href="mailto:{{PROFILE_EMAIL}}" aria-label="E-posta gönder / Send email">
                    <span aria-hidden="true">@</span>
                </a>
            </div>
        </div>
        <div class="hero-right">
            <div class="swing-wrapper" data-badge>
                <!-- Askı, klips ve kart tek parça: kart aşağı çekilir, bırakınca yaylanarak geri sarılır -->
                <div class="badge-rig">
                <!-- KULLANILMIYOR: eski düz ip (kart sallanırken sabit kalıyordu)
                <div class="swing-line" aria-hidden="true"></div> -->
                <div class="lanyard" aria-hidden="true">
                    <span class="lanyard-text"><span class="tk-const">const</span> <span class="tk-var">developer</span> = <span class="tk-str">"Ayşe Nur Kendirci"</span>; <span class="tk-const">const</span> <span class="tk-var">developer</span> = <span class="tk-str">"Ayşe Nur Kendirci"</span>;</span>
                </div>
                <span class="lanyard-clip" aria-hidden="true"></span>
                <article class="portfolio-card">
                    <span class="card-glare" aria-hidden="true"></span>
                    <div class="portfolio-card-header" aria-hidden="true"></div>
                    <div class="portfolio-card-image">
                        <img src="{{PROFILE_IMAGE}}"
                             width="960" height="1200"
                             decoding="async"
                             fetchpriority="high"
                             alt="Ayşe Nur Kendirci portre fotoğrafı"
                             data-alt-en="Portrait of Ayşe Nur Kendirci"
                             data-alt-tr="Ayşe Nur Kendirci portre fotoğrafı">
                    </div>
                    <div class="portfolio-card-footer">
                        <h2>{{PROFILE_NAME}}</h2>
                        <p data-en="{{PROFILE_ROLE_EN}}"
                           data-tr="{{PROFILE_ROLE_TR}}">
                            {{PROFILE_ROLE_EN}}
                        </p>
                    </div>
                </article>
                </div>
                <p class="pull-hint" aria-hidden="true">
                    <i class="fa-solid fa-hand-pointer"></i>
                    <span class="hint-mouse" data-en="Pull the card down" data-tr="Kartı aşağı çek">Pull the card down</span>
                    <span class="hint-touch" data-en="Tap the card" data-tr="Karta dokun">Tap the card</span>
                </p>
            </div>
        </div>
    </div>
</section>
