<section id="skills" class="sec skills" aria-labelledby="skills-title">
    <div class="container">
        <header class="sec-head rise">
            <h2 id="skills-title" class="sec-title" data-en="Tech Stack" data-tr="Teknolojiler">Tech Stack</h2>
            <span class="sec-rule" aria-hidden="true"></span>
        </header>
        <div class="panel stack-panel" data-stagger>
            {{#each techCategories}}
            <div class="stack-row rise">
                <h3 class="stack-name">
                    <i class="{{catIcon}}" aria-hidden="true"></i>
                    <span data-en="{{title.en}}" data-tr="{{title.tr}}">{{title.en}}</span>
                </h3>
                <ul class="chip-list">
                    {{#each items}}
                    <li class="chip" tabindex="0"
                        data-tooltip="{{tooltip.en}}"
                        data-tooltip-en="{{tooltip.en}}"
                        data-tooltip-tr="{{tooltip.tr}}">
                        <i class="{{icon}}" aria-hidden="true"></i>
                        <span>{{name}}</span>
                    </li>
                    {{/each}}
                </ul>
            </div>
            {{/each}}
        </div>
    </div>
</section>
